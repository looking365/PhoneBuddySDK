name: Android APK Build

on:
  push:
    branches: [main, apk_builder]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'scripts/build-android-sdk.sh'
      - 'examples/android/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'scripts/build-android-sdk.sh'
      - 'examples/android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      version_name:
        description: 'Version name (e.g. 1.2.3). Leave empty to use Gradle default.'
        required: false
        default: ''
        type: string
      version_code:
        description: 'Version code (integer, e.g. 10203). Leave empty to use Gradle default.'
        required: false
        default: ''
        type: string

env:
  CARGO_TERM_COLOR: always
  ANDROID_NDK_VERSION: "27.0.12077973"
  RUST_TOOLCHAIN: "1.94.0"

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-linux-android,x86_64-linux-android
          components: rustfmt,clippy

      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: android-rust-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            android-rust-${{ runner.os }}-

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          packages: "ndk;${{ env.ANDROID_NDK_VERSION }}"

      - name: Locate NDK path
        id: ndk
        run: |
          NDK_PATH="$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}"
          if [ ! -d "$NDK_PATH" ]; then
            echo "NDK not found at $NDK_PATH"
            ls -la "$ANDROID_HOME/ndk/" || true
            exit 1
          fi
          echo "ndk_path=$NDK_PATH" >> "$GITHUB_OUTPUT"
          echo "Using NDK: $NDK_PATH"

      - name: Debug - Check Cargo.lock status
        run: |
          echo "=== Cargo.lock status ==="
          cargo check --workspace --locked 2>&1 | head -50 || true
          echo "=== Rust version ==="
          rustc --version
          cargo --version

      - name: Run cargo check
        run: cargo check --workspace

      - name: Cross-compile Rust FFI library (arm64-v8a & x86_64)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk_path }}
        run: ./scripts/build-android-sdk.sh arm64-v8a x86_64

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Copy .so into Gradle jniLibs
        run: |
          mkdir -p examples/android/app/src/main/jniLibs
          cp -r dist/android/jniLibs/* examples/android/app/src/main/jniLibs/
          echo "sdk.dir=$ANDROID_HOME" > examples/android/local.properties
          echo "Copied native libraries:"
          find examples/android/app/src/main/jniLibs -name "*.so" -exec ls -lh {} \;

      - name: Resolve build parameters
        id: params
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          if [ -z "$BUILD_TYPE" ]; then
            BUILD_TYPE="debug"
          fi
          echo "build_type=$BUILD_TYPE" >> "$GITHUB_OUTPUT"

          VERSION_NAME="${{ github.event.inputs.version_name }}"
          VERSION_CODE="${{ github.event.inputs.version_code }}"

          GRADLE_ARGS=""
          if [ -n "$VERSION_NAME" ]; then
            GRADLE_ARGS="$GRADLE_ARGS -PversionNameOverride=$VERSION_NAME"
          fi
          if [ -n "$VERSION_CODE" ]; then
            GRADLE_ARGS="$GRADLE_ARGS -PversionCodeOverride=$VERSION_CODE"
          fi
          echo "gradle_args=$GRADLE_ARGS" >> "$GITHUB_OUTPUT"
          echo "Build type: $BUILD_TYPE"
          echo "Gradle args: $GRADLE_ARGS"

      - name: Build APK with Gradle
        working-directory: examples/android
        run: |
          chmod +x gradlew
          if [ "${{ steps.params.outputs.build_type }}" = "release" ]; then
            ./gradlew assembleRelease ${{ steps.params.outputs.gradle_args }} --no-daemon
          else
            ./gradlew assembleDebug ${{ steps.params.outputs.gradle_args }} --no-daemon
          fi

      - name: Locate APK output
        id: apk
        run: |
          APK_PATH=$(find examples/android/app/build/outputs/apk -name "*.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "APK not found!"
            find examples/android/app/build/outputs -type f || true
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "apk_name=$(basename "$APK_PATH")" >> "$GITHUB_OUTPUT"
          APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
          echo "APK built: $APK_PATH ($APK_SIZE)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: phonebuddy-android-${{ steps.params.outputs.build_type }}-${{ github.sha }}
          path: ${{ steps.apk.outputs.apk_path }}
          retention-days: 30
          if-no-files-found: error
